---
- name: Install Docker, required software, and deploy containers
  hosts: all

  gather_facts: true
  become: true
  become_user: root

  vars:
    # Read all of the key value pairs from the .env file in as environment variables
    env_vars: "{{ dict(lookup('file', '.env') | regex_findall('^([^#][^=]+)=(.*)$', multiline=True)) }}"
    container_names:
      - raspap
      - portainer
      - pihole
      - jellyfin
      - heimdall

  tasks:

    - name: Determine if this is a Raspberry Pi
      ansible.builtin.set_fact:
        is_raspberry_pi: "{{ 'Raspberry' in (ansible_product_name | default('')) }}"

    - name: Install pre-deployment software
      ansible.builtin.include_tasks:
        file: "tasks/pre_deployment.yml"

    - name: Install other container services in order
      ansible.builtin.include_tasks:
        file: "tasks/deploy_containers.yml"
      loop: "{{ container_names }}"
      loop_control:
        loop_var: deployment_name

    - name: Configure Pihole if it was installed
      ansible.builtin.include_tasks:
        file: "tasks/configure_pihole.yml"
      when: "'pihole' in container_names"

    - name: Post Deployment Tasks - GUI only
      ansible.builtin.include_tasks:
        file: "tasks/post_deployment.yml"
      when: env_vars.gui_enabled
